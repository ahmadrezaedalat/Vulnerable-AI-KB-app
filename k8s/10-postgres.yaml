apiVersion: v1
kind: Secret
metadata:
  name: vulnerableapp-postgres
  namespace: vulnerableapp-db
type: Opaque
stringData:
  POSTGRES_DB: vulnerableapp
  POSTGRES_USER: vulnerableapp
  POSTGRES_PASSWORD: change-me-before-deploy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vulnerableapp-postgres-data
  namespace: vulnerableapp-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerableapp-postgres
  namespace: vulnerableapp-db
  labels:
    app.kubernetes.io/name: vulnerableapp-postgres
    app.kubernetes.io/part-of: vulnerableapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnerableapp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnerableapp-postgres
        app.kubernetes.io/part-of: vulnerableapp
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vulnerableapp-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vulnerableapp-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnerableapp-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: vulnerableapp-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerableapp-postgres
  namespace: vulnerableapp-db
  labels:
    app.kubernetes.io/name: vulnerableapp-postgres
    app.kubernetes.io/part-of: vulnerableapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vulnerableapp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
